name: Update screener

on:
  schedule:
    # Every 15 minutes, 13:00-21:59 UTC on weekdays. The script itself checks
    # New York time and only works 9:30 am - 4:30 pm ET on market days.
    - cron: "*/15 13-21 * * 1-5"
  # Also run right away when the program or stock list changes (and by hand from the Actions tab).
  push:
    branches: [main]
    paths: ["screener.py", "data/tickers.csv", ".github/workflows/screener.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run checks
        run: python test_screener.py
      - name: Run screener
        run: python -W ignore screener.py ${{ github.event_name != 'schedule' && '--force' || '' }}
      - name: Save new data
        run: |
          git add docs/data.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "screener-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update screener data"
          git pull --rebase
          git push
